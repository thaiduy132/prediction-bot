[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-trader"
version = "0.1.0"
description = "Measure whether Jev has a real edge on Binance Prediction Market BTC Up/Down 5m rounds"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
