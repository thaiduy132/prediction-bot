# Copy thành config.yaml rồi chỉnh. Secrets (JEV_API_KEY, Binance keys) KHÔNG đặt ở đây, dùng .env.
# Các khoá không hợp lệ/gõ sai sẽ bị báo lỗi khi load (extra="forbid").

market:
  symbol: BTCUSDT
  round_interval: 5m

settlement:
  # !!! PHẢI ĐỐI CHIẾU với luật chính thức của TỪNG thị trường Binance Prediction Market:
  #   - hoà (close == open) tính là gì: Up, Down hay hoàn tiền?
  #   - giá tham chiếu là gì: giá khớp spot, index price hay mark price? Lấy ở giây nào?
  #   - mốc bắt đầu/kết thúc vòng có trùng với nến 5m của Binance spot không?
  # Nếu khác, kết quả backtest sẽ bị lệch.
  #
  # close_gte_open : close >= open -> UP   (hoà -> UP)   [mặc định]
  # close_gt_open  : close >  open -> UP   (hoà -> DOWN)
  # tie_void       : hoà -> VOID (hoàn tiền)
  rule: close_gte_open
  price_source: binance_spot_kline   # chỉ nguồn này được hỗ trợ hiện tại

websocket:
  # mirror dữ liệu công khai của Binance; stream.binance.com:9443 bị chặn (HTTP 451) ở một số vùng
  base_url: wss://data-stream.binance.vision:443
  kline_intervals: [1s, 1m, 5m]   # 1s -> nến giây (gộp thành 30s ở bước sau)
  book_ticker: true
  depth_levels: 20            # 0 | 5 | 10 | 20: order book nông (cần cho imbalance)
  depth_speed_ms: 100         # 100 | 1000
  backoff_initial_s: 1.0
  backoff_max_s: 60.0
  backoff_factor: 2.0
  backoff_jitter: 0.2
  stable_after_s: 60          # kết nối sống >= 60s thì reset backoff
  stale_timeout_s: 30         # 30s không có message -> coi là chết, kết nối lại
  max_connection_age_s: 84600 # 23.5h; Binance tự ngắt sau 24h

rest:
  # mirror dữ liệu công khai của Binance; api.binance.com bị chặn (HTTP 451) ở một số vùng
  base_url: https://data-api.binance.vision
  timeout_s: 10
  max_retries: 5

data:
  cache_path: data/klines.sqlite
  book_path: data/book.sqlite   # mẫu order book 1 giây/lần, ghi bằng `data record` hoặc `ui`

backtest:
  strategy: momentum        # momentum | reversal | always_up | book | momentum_book | value
  decision_s: 270           # đặt lệnh sau khi vòng mở 270s (còn 30s)
  min_move_bps: 1.0         # momentum/reversal: bỏ qua nếu |biến động| nhỏ hơn
  # !!! PHẢI ĐỐI CHIẾU tỷ lệ thắng thực của thị trường (lãi ròng trên 1 đơn vị cược khi thắng).
  # 0.9 chỉ là giá trị tạm; PnL sai nếu không khớp thực tế.
  payout_ratio: 0.9
  # Chế độ odds (`run --mode backtest --odds`): giá vào lệnh lấy từ odds Predict.fun đã ghi
  # (`data record-odds`), thay cho payout_ratio. Phí và đặt lệnh là của Binance.
  use_odds: false
  fee_bps: 0                # phí Binance tính trên tiền cược mỗi lệnh; điền phí thật, 0 sẽ làm kết quả đẹp hơn thực tế
  max_entry_price: 1.0      # bỏ qua lệnh có giá mua/cổ phiếu cao hơn mức này (vd 0.9)
  # chiến lược value: chỉ vào lệnh khi xác suất thắng đã hiệu chỉnh cao hơn giá mua đủ nhiều
  calibration_path: data/calibration.json   # tạo bằng `python -m bot data calibrate`
  min_edge: 0.03            # lãi kỳ vọng tối thiểu trên 1 đơn vị cược, sau phí
  min_samples: 100          # bỏ qua nhóm |z| có ít hơn N vòng khi hiệu chỉnh
  # chiến lược order book (cần dữ liệu đã ghi bằng `python -m bot data record`)
  book_levels: 10           # 1 | 5 | 10 | 20 mức giá dùng tính imbalance
  book_window_s: 10         # lấy trung bình imbalance trong N giây cuối
  min_imbalance: 0.2        # |imbalance| tối thiểu để vào lệnh (0..1)
  max_spread_bps: 2.0       # bỏ qua khi spread rộng hơn mức này
  trades_path: data/backtest_trades.jsonl

predict:
  # Predict.fun = sàn đứng sau Prediction Market của Binance Wallet.
  # testnet không cần key nhưng KHÔNG có thanh khoản cho vòng BTC; odds thật cần mainnet + PREDICT_API_KEY.
  base_url: https://api-testnet.predict.fun   # mainnet: https://api.predict.fun
  poll_interval_s: 1.0                        # mainnet giới hạn mặc định 240 req/phút
  timeout_s: 10
  odds_path: data/odds.sqlite

paper:
  trades_path: data/paper.sqlite   # lệnh giả lập (paper), giữ lại giữa các lần chạy

live:
  # Lệnh thật đi qua Binance Agentic Wallet CLI: npm install -g @binance/agentic-wallet && baw auth signin
  # Chạy `run --mode shadow` trước (báo giá thật, KHÔNG đặt lệnh); live cần thêm --i-understand-the-risk.
  baw_path: baw
  chain_id: 56                  # BNB Smart Chain (Predict.fun)
  stake_usd: 1.0                # tiền cược mỗi lệnh
  max_daily_loss_usd: 3.0       # lỗ tối đa/ngày (tính cả lệnh đang mở như đã thua)
  max_bets_per_day: 20
  max_open_positions: 1
  slippage_bps: 200
  max_price_slippage: 0.02      # bỏ lệnh nếu giá báo thật tệ hơn giá lúc quyết định quá mức này
  deadline_ms: 5000             # bỏ lệnh nếu không gửi được trong 5s sau quyết định
  max_retries: 3                # Binance báo FAILED thì đặt lại (báo giá mới), tối đa 3 lần
  retry_window_s: 60            # không đặt lại nếu đã quá 60s sau lúc quyết định
  kill_switch_path: data/STOP   # tạo file này để dừng đặt lệnh ngay lập tức
  journal_path: data/live.sqlite

logging:
  level: INFO
  file: data/bot.log.jsonl
